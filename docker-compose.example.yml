# Reference deployment. The bot and the recorder are separate containers that
# share one SQLite file: the bot writes archive jobs, the recorder consumes
# them. Both mount ./bot-data for that reason.
services:
  discord-bot:
    image: kacperacy/barker:main
    container_name: barker
    restart: unless-stopped
    volumes:
      - ./bot-data:/app/db
      - ./bot-logs:/app/logs
    env_file:
      - .env

  recorder:
    image: kacperacy/barker-recorder:main
    container_name: barker-recorder
    restart: unless-stopped
    volumes:
      # Same database file as the bot — this is the job queue.
      - ./bot-data:/app/db
      # Scratch space for segments in flight. Each one is deleted as soon as
      # it is uploaded, so this stays small; size it for a couple of segments.
      - ./recordings:/data/recordings
      # rclone.conf generated on your own machine, never on the VPS.
      - ./rclone:/config/rclone:ro
    env_file:
      - .env
    # Give captures time to finish their current segment on redeploy; killing
    # ffmpeg mid-segment loses it.
    stop_grace_period: 120s
    expose:
      - "3000"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - DOCKER_API_VERSION=1.44
